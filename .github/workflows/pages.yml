name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apuntar la UI al backend
        env:
          API: ${{ vars.AUTOPLATE_API }}
        run: |
          if [ -n "$API" ]; then
            printf 'window.AUTOPLATE_API = "%s";\n' "$API" > web/static/config.js
            echo "API configurada: $API"
          else
            echo "::warning::Define la variable AUTOPLATE_API del repositorio o la UI no tendrá datos."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
