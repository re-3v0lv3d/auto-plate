services:
  - type: web
    name: auto-plate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn plate_lookup.web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STORAGE
        value: firestore
      - key: CAPTCHA_PROVIDER
        value: site
      - key: CORS_ORIGINS
        value: "*"
      # Firestore necesita credenciales: define GOOGLE_APPLICATION_CREDENTIALS
      # con un service account (roles/datastore.user) o usa Cloud Run.
      - key: GCP_PROJECT
        value: tu-proyecto
