services:
  - type: web
    name: auto-plate
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CAPTCHA_PROVIDER
        value: cfsolve
      - key: STORAGE
        value: sqlite
      # El disco de Render free es efímero: la caché se reconstruye con las consultas.
      - key: DB_PATH
        value: /tmp/vehicles.db
      - key: CORS_ORIGINS
        value: https://re-3v0lv3d.github.io
      - key: ALLOW_WEB_PROVIDER
        value: "1"
      # Se piden en el panel al crear el Blueprint (no van en el repo).
      - key: API_USER
        sync: false
      - key: API_PASSWORD
        sync: false
